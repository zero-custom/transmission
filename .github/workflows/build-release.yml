name: Build Patched Release
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        type: string
        required: false
        description: '上游 tag（如 4.1.3）；留空则自动检测'
      force:
        type: boolean
        required: false
        default: false
        description: 'tag 已构建时强制重建（生成下一个 -pN）'

permissions:
  contents: write
  issues: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  detect-tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.detect.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect new upstream tags
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "tags=$(.github/scripts/detect-new-tags.sh '${{ inputs.upstream_tag }}' '${{ inputs.force == true && '1' || '0' }}' | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    needs: detect-tags
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]
        arch: [amd64, arm64, armv7]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build patched binaries for ${{ matrix.libc }}/${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '${{ needs.detect-tags.outputs.tags }}' | jq -c . > /tmp/tags.json
          .github/scripts/build-patched.sh '${{ matrix.arch }}' '${{ matrix.libc }}' /tmp/tags.json
      - name: Upload artifacts
        if: ${{ needs.detect-tags.outputs.tags != '["__skip__"]' }}
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.libc }}-${{ matrix.arch }}
          path: out-*/
          if-no-files-found: error

  publish:
    needs: [detect-tags, build]
    if: always() && needs.detect-tags.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          pattern: build-*
          merge-multiple: true
          path: artifacts
      - name: Publish fork releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '${{ needs.detect-tags.outputs.tags }}' | jq -c . > /tmp/tags.json
          .github/scripts/publish-release.sh /tmp/tags.json artifacts
